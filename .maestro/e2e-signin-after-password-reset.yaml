      id: e2e-auth-email-input
    timeout: 30000
- tapOn:
    id: e2e-auth-email-input
- eraseText
- inputText: epix.tester@proton.me
- tapOn:
    id: e2e-auth-password-input
- inputText: EpiphyX456!
- tapOn:
    id: e2e-auth-primary-button
- extendedWaitUntil:
    visible: "Signed in successfully."
    timeout: 30000
