appId: com.richfarm.app
---
- openLink:
    link: richfarm://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible:
        id: e2e-onboarding-skip-button
    commands:
      - tapOn:
          id: e2e-onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: e2e-tab-home
    timeout: 60000
- openLink:
    link: richfarm://profile
- extendedWaitUntil:
    visible: "Garden & App"
    timeout: 10000
- tapOn: "Garden & App"
- extendedWaitUntil:
    visible:
      id: e2e-profile-mode-farmer
    timeout: 10000
- scrollUntilVisible:
    element:
      id: e2e-profile-mode-farmer
    direction: DOWN
    timeout: 10000
- tapOn:
    id: e2e-profile-mode-farmer
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"
- openLink:
    link: richfarm://home
- openLink:
    link: richfarm:///garden
- extendedWaitUntil:
    visible:
      id: e2e-tab-garden
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: e2e-garden-card
    commands:
      - tapOn:
          id: e2e-garden-empty-create
      - extendedWaitUntil:
          visible:
            id: e2e-garden-create-name-input
          timeout: 10000
      - tapOn:
          id: e2e-garden-create-name-input
      - eraseText
      - inputText: QA Garden
      - tapOn:
          id: e2e-garden-create-area-input
      - eraseText
      - inputText: 6
      - swipe:
          start: "50%,60%"
          end: "50%,25%"
          duration: 500
      - swipe:
          start: "50%,70%"
          end: "50%,35%"
          duration: 500
      - tapOn:
          id: e2e-garden-create-submit
      - extendedWaitUntil:
          notVisible:
            id: e2e-garden-create-name-input
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: e2e-garden-card
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "18%,43%"
- extendedWaitUntil:
    visible:
      id: e2e-garden-detail-add-bed
    timeout: 30000
- tapOn:
    id: e2e-garden-detail-add-bed
- runFlow:
    when:
      visible:
        id: e2e-garden-bed-name-input
    commands:
      - tapOn:
          id: e2e-garden-bed-name-input
      - eraseText
      - inputText: QA Bed
      - scrollUntilVisible:
          element:
            id: e2e-garden-bed-save
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: e2e-garden-bed-save
- scrollUntilVisible:
    element:
      id: e2e-garden-bed-list
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: e2e-garden-bed-list
    timeout: 30000
