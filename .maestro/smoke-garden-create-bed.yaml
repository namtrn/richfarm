appId: com.richfarm.app
---
- openLink:
    link: richfarm://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible:
        id: e2e-onboarding-skip-button
    commands:
      - tapOn:
          id: e2e-onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: e2e-tab-home
    timeout: 60000
- openLink:
    link: richfarm://profile
- scrollUntilVisible:
    element:
      id: e2e-profile-mode-farmer
    direction: DOWN
    timeout: 10000
- tapOn:
    id: e2e-profile-mode-farmer
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"
- openLink:
    link: richfarm://garden
- tapOn:
    id: e2e-garden-create-close
    optional: true
- runFlow:
    when:
      notVisible:
        id: e2e-garden-card
    commands:
      - tapOn:
          id: e2e-garden-empty-create
      - extendedWaitUntil:
          visible:
            id: e2e-garden-create-name-input
          timeout: 10000
      - tapOn:
          id: e2e-garden-create-name-input
      - eraseText
      - inputText: QA Garden
      - pressKey: Enter
      - tapOn:
          id: e2e-garden-create-area-input
      - eraseText
      - inputText: 6
      - swipe:
          start: "50%,60%"
          end: "50%,25%"
          duration: 500
      - swipe:
          start: "50%,70%"
          end: "50%,35%"
          duration: 500
      - tapOn:
          id: e2e-garden-create-submit
      - extendedWaitUntil:
          notVisible:
            id: e2e-garden-create-name-input
          timeout: 10000
      - openLink:
          link: richfarm://garden
      - extendedWaitUntil:
          visible:
            id: e2e-garden-card
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "18%,43%"
- tapOn:
    point: "18%,43%"
- extendedWaitUntil:
    visible:
      id: e2e-garden-detail-add-bed
    timeout: 30000
- tapOn:
    id: e2e-garden-detail-add-bed
- extendedWaitUntil:
    visible:
      id: e2e-garden-bed-name-input
    timeout: 10000
- tapOn:
    id: e2e-garden-bed-name-input
- eraseText
- inputText: QA Bed
- pressKey: Enter
- tapOn:
    id: e2e-garden-bed-save
- extendedWaitUntil:
    visible: QA Bed
    timeout: 30000
