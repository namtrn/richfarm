appId: com.richfarm.app
---
- openLink:
    link: richfarm://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible:
        id: e2e-onboarding-skip-button
    commands:
      - tapOn:
          id: e2e-onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: e2e-tab-home
    timeout: 60000
- openLink:
    link: richfarm://scan
- extendedWaitUntil:
    visible:
      id: e2e-scan-open-button
    timeout: 30000
- tapOn:
    id: e2e-scan-open-button
- tapOn:
    text: Cancel
    optional: true
