appId: com.richfarm.app
---
- openLink:
    link: richfarm://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible:
        id: e2e-onboarding-start-button
    commands:
      - tapOn:
          id: e2e-onboarding-start-button
- runFlow:
    when:
      visible:
        id: e2e-onboarding-skip-button
    commands:
      - tapOn:
          id: e2e-onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: e2e-tab-home
    timeout: 60000
- tapOn: "Home"
- tapOn: "My Plants"
- tapOn:
    id: e2e-garden-tab-planning
    optional: true
- openLink:
    link: richfarm://reminder
- openLink:
    link: richfarm://library
- extendedWaitUntil:
    visible:
      id: e2e-library-search-input
    timeout: 30000
- tapOn:
    id: e2e-library-shortcut-health
    optional: true
- tapOn:
    id: e2e-health-tab-light
    optional: true
- openLink:
    link: richfarm://library
- tapOn:
    id: e2e-library-search-input
- eraseText
- inputText: to
- tapOn:
    id: e2e-library-plant-card
    optional: true
- tapOn:
    id: e2e-library-modal-close
    optional: true
- tapOn:
    id: e2e-tab-more
    optional: true
- tapOn:
    id: e2e-profile-sync-now
    optional: true
- tapOn:
    id: e2e-profile-save-settings
    optional: true
