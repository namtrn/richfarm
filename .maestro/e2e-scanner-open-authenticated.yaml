appId: com.richfarm.app
---
# Run on a simulator signed into the isolated E2E/staging account.
- openLink:
    link: richfarm://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- runFlow:
    when:
      visible:
        id: e2e-onboarding-skip-button
    commands:
      - tapOn:
          id: e2e-onboarding-skip-button
- extendedWaitUntil:
    visible:
      id: e2e-tab-home
    timeout: 60000
- tapOn:
    id: e2e-tab-library
- tapOn:
    id: e2e-tab-home
- waitForAnimationToEnd
- tapOn:
    text: Quick actions
- extendedWaitUntil:
    visible:
      id: e2e-action-scan
    timeout: 10000
- tapOn:
    id: e2e-action-scan
- extendedWaitUntil:
    visible:
      id: e2e-scanner-source-modal
    timeout: 10000
- assertVisible:
    id: e2e-scanner-source-camera
- assertVisible:
    id: e2e-scanner-source-library
- tapOn:
    id: e2e-scanner-source-cancel
- extendedWaitUntil:
    notVisible:
      id: e2e-scanner-source-modal
    timeout: 10000
